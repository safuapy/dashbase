name: Build Wallets and Daemon

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-intel
            runner: macos-15-intel
            host_triplet: x86_64-apple-darwin
            gui: 'true'
            artifact_name: dashcore-macos-intel
            artifact_ext: dmg

          - target: windows
            runner: ubuntu-22.04
            host_triplet: x86_64-w64-mingw32
            gui: 'true'
            artifact_name: dashcore-windows
            artifact_ext: zip

          - target: linux-daemon
            runner: ubuntu-22.04
            host_triplet: x86_64-pc-linux-gnu
            gui: 'false'
            artifact_name: dashcore-linux-daemon
            artifact_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set version from git
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev-$(git rev-parse --short HEAD))" >> $GITHUB_OUTPUT
          fi

      # ── Cache: depends sources (downloaded tarballs) ─────────────
      - name: Cache depends sources
        uses: actions/cache@v4
        with:
          path: depends/sources
          key: depends-sources-${{ matrix.host_triplet }}-${{ hashFiles('depends/packages/*') }}
          restore-keys: |
            depends-sources-${{ matrix.host_triplet }}-

      # ── Cache: depends built artifacts ───────────────────────────
      - name: Cache depends built
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-built-${{ matrix.host_triplet }}-${{ hashFiles('depends/packages/*', 'depends/Makefile') }}
          restore-keys: |
            depends-built-${{ matrix.host_triplet }}-

      # ── Cache: ccache (compiler cache for source builds) ─────────
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ccache' || '~/.ccache' }}
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      # ── macOS Intel ──────────────────────────────────────────────
      - name: Install macOS dependencies
        if: matrix.target == 'macos-intel'
        run: |
          brew install automake libtool pkg-config libnatpmp berkeley-db boost libevent qt@5 miniupnpc zeromq sqlite librsvg ccache python3
          pip3 install --break-system-packages setuptools

      - name: Build macOS (depends + configure + make + deploy)
        if: matrix.target == 'macos-intel'
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          export CCACHE_DIR="$HOME/Library/Caches/ccache"
          ccache -M 500M 2>/dev/null || true
          cd depends
          make HOST=${{ matrix.host_triplet }} -j$(sysctl -n hw.logicalcpu)
          cd ..
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${{ matrix.host_triplet }}/share/config.site" \
            ./configure --prefix=/opt/dashbase --with-gui=yes CC="ccache clang" CXX="ccache clang++" CXXFLAGS="-Wno-enum-constexpr-conversion" CPPFLAGS="-DBOOST_NO_CXX98_FUNCTION_BASE"
          make -j$(sysctl -n hw.logicalcpu)
          make install DESTDIR="$PWD/release"
          # Build .app bundle and .dmg via macdeployqtplus
          make deploy
          ccache -s 2>/dev/null || true

      - name: Package macOS DMG
        if: matrix.target == 'macos-intel'
        run: |
          # Find the DMG produced by make deploy
          DMG_FILE=$(ls *.dmg 2>/dev/null | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "ERROR: No DMG found, falling back to tar.gz"
            STAGING="dashcore-${{ steps.version.outputs.version }}-macos-intel"
            mkdir -p "$STAGING"
            cp -R release/opt/dashbase/{bin,lib,share} "$STAGING/" 2>/dev/null || true
            tar -czf "${{ matrix.artifact_name }}.tar.gz" "$STAGING"
            exit 0
          fi
          echo "Found DMG: $DMG_FILE"
          # Ad-hoc sign the DMG so Gatekeeper shows a cleaner warning
          # (still requires right-click -> Open, but not "damaged")
          codesign -s - --force "$DMG_FILE" 2>/dev/null || true
          # Rename to our artifact name
          mv "$DMG_FILE" "${{ matrix.artifact_name }}.dmg" || true
          # Also package daemon binaries in a separate tar.gz for CLI users
          STAGING="dashcore-${{ steps.version.outputs.version }}-macos-intel-daemon"
          mkdir -p "$STAGING"
          cp -R release/opt/dashbase/{bin,lib,share} "$STAGING/" 2>/dev/null || true
          tar -czf "${{ matrix.artifact_name }}-daemon.tar.gz" "$STAGING"

      # ── Windows (cross-compile from Ubuntu) ──────────────────────
      - name: Install Windows cross-compile dependencies
        if: matrix.target == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 bison \
            g++-mingw-w64-x86-64-posix nsis ccache
          # Ensure posix thread model is default (win32 threads conflict with std::mutex)
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix 2>/dev/null || true
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix 2>/dev/null || true

      - name: Build Windows (depends + configure + make + deploy)
        if: matrix.target == 'windows'
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 500M 2>/dev/null || true
          cd depends
          make HOST=${{ matrix.host_triplet }} -j$(nproc)
          cd ..
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${{ matrix.host_triplet }}/share/config.site" \
            ./configure --prefix=/ --with-gui=yes \
              CC="ccache x86_64-w64-mingw32-gcc" CXX="ccache x86_64-w64-mingw32-g++"
          make -j$(nproc)
          # Build NSIS installer
          make deploy
          ccache -s 2>/dev/null || true

      - name: Package Windows
        if: matrix.target == 'windows'
        run: |
          # Find the NSIS installer produced by make deploy
          INSTALLER=$(ls *-win64-setup.exe 2>/dev/null | head -1)
          if [ -n "$INSTALLER" ]; then
            echo "Found NSIS installer: $INSTALLER"
            mv "$INSTALLER" "${{ matrix.artifact_name }}-setup.exe" || true
          else
            echo "WARNING: No NSIS installer found, falling back to zip"
          fi
          # Also create a zip with all binaries for CLI users
          STAGING="dashcore-${{ steps.version.outputs.version }}-windows"
          mkdir -p "$STAGING"
          make install DESTDIR="$PWD/$STAGING"
          # Copy Qt DLLs and plugins into the staging dir
          if [ -d "depends/${{ matrix.host_triplet }}/bin" ]; then
            cp depends/${{ matrix.host_triplet }}/bin/*.dll "$STAGING/bin/" 2>/dev/null || true
          fi
          if [ -d "depends/${{ matrix.host_triplet }}/plugins" ]; then
            mkdir -p "$STAGING/plugins"
            cp -R depends/${{ matrix.host_triplet }}/plugins/* "$STAGING/plugins/" 2>/dev/null || true
          fi
          cd "$STAGING"
          zip -r "../${{ matrix.artifact_name }}.${{ matrix.artifact_ext }}" .
          cd ..

      # ── Linux Daemon (no GUI) ────────────────────────────────────
      - name: Install Linux build dependencies
        if: matrix.target == 'linux-daemon'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 bison ccache

      - name: Build Linux daemon (depends + configure + make)
        if: matrix.target == 'linux-daemon'
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 500M 2>/dev/null || true
          cd depends
          make HOST=${{ matrix.host_triplet }} NO_QT=1 -j$(nproc)
          cd ..
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${{ matrix.host_triplet }}/share/config.site" \
            ./configure --prefix=/opt/dashbase --without-gui CC="ccache gcc" CXX="ccache g++"
          make -j$(nproc)
          make install DESTDIR="$PWD/release"
          ccache -s 2>/dev/null || true

      - name: Package Linux daemon
        if: matrix.target == 'linux-daemon'
        run: |
          STAGING="dashcore-${{ steps.version.outputs.version }}-linux-daemon"
          mkdir -p "$STAGING"
          cp -R release/opt/dashbase/{bin,lib,share} "$STAGING/" 2>/dev/null || true
          # Strip binaries
          strip "$STAGING/bin/"* 2>/dev/null || true
          tar -czf "${{ matrix.artifact_name }}.${{ matrix.artifact_ext }}" "$STAGING"

      # ── Upload Artifacts ─────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}-setup.exe
            ${{ matrix.artifact_name }}.${{ matrix.artifact_ext }}
            ${{ matrix.artifact_name }}-daemon.tar.gz
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  # ── Release: attach artifacts to GitHub Release on tag push ─────
  release:
    name: Attach to Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*-setup.exe
          generate_release_notes: true
          draft: true
