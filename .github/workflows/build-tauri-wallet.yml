name: Build Tauri Wallet

on:
  push:
    tags:
      - 'v*'
    branches:
      - tauri-wallet-rewrite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-wallet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-Intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri-wallet/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev xdg-utils

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && secrets.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Install frontend dependencies
        run: bun install
        working-directory: src-tauri-wallet

      - name: Download daemon binary
        shell: bash
        run: |
          mkdir -p src-tauri-wallet/src-tauri/resources
          # Try to download daemon artifact from the latest successful build-wallets run
          DAEMON_ARTIFACT=""
          if [[ "${{ matrix.label }}" == "macOS-ARM" ]]; then
            DAEMON_ARTIFACT="dashcore-macos-intel"
          elif [[ "${{ matrix.label }}" == "macOS-Intel" ]]; then
            DAEMON_ARTIFACT="dashcore-macos-intel"
          elif [[ "${{ matrix.label }}" == "Linux" ]]; then
            DAEMON_ARTIFACT="dashcore-linux-daemon"
          elif [[ "${{ matrix.label }}" == "Windows" ]]; then
            DAEMON_ARTIFACT="dashcore-windows"
          fi

          echo "Downloading daemon artifact: $DAEMON_ARTIFACT"

          # Use GitHub CLI to download the latest artifact
          if gh run download -n "$DAEMON_ARTIFACT" -D daemon-artifacts --repo ${{ github.repository }} 2>/dev/null; then
            echo "Downloaded daemon artifacts"
            ls -la daemon-artifacts/ || true

            # Find and extract the daemon tarball
            TARBALL=$(find daemon-artifacts -name "*.tar.gz" | head -1)
            if [ -n "$TARBALL" ]; then
              echo "Extracting: $TARBALL"
              tar -xzf "$TARBALL" -C daemon-artifacts/
              # Find the dashbased binary
              DAEMON_BIN=$(find daemon-artifacts -name "dashbased" -o -name "dashbased.exe" | head -1)
              if [ -n "$DAEMON_BIN" ]; then
                echo "Found daemon binary: $DAEMON_BIN"
                if [[ "${{ matrix.label }}" == "Windows" ]]; then
                  cp "$DAEMON_BIN" src-tauri-wallet/src-tauri/resources/dashbased.exe
                else
                  cp "$DAEMON_BIN" src-tauri-wallet/src-tauri/resources/dashbased
                  chmod +x src-tauri-wallet/src-tauri/resources/dashbased
                fi
                echo "Daemon binary placed in resources/"
              fi
            fi

            # Also try zip for Windows
            ZIPFILE=$(find daemon-artifacts -name "*.zip" | head -1)
            if [ -n "$ZIPFILE" ] && [ ! -f "src-tauri-wallet/src-tauri/resources/dashbased.exe" ]; then
              echo "Extracting: $ZIPFILE"
              cd daemon-artifacts && unzip -o "$ZIPFILE" && cd ..
              DAEMON_BIN=$(find daemon-artifacts -name "dashbased.exe" | head -1)
              if [ -n "$DAEMON_BIN" ]; then
                cp "$DAEMON_BIN" src-tauri-wallet/src-tauri/resources/dashbased.exe
                echo "Windows daemon binary placed in resources/"
              fi
            fi
          else
            echo "Could not download daemon artifact. Building without bundled daemon."
            echo "The wallet will still work if dashbased is installed in PATH."
          fi

          ls -la src-tauri-wallet/src-tauri/resources/ || true

          # Update tauri.conf.json to include the daemon as a resource
          if [ -f "src-tauri-wallet/src-tauri/resources/dashbased" ] || [ -f "src-tauri-wallet/src-tauri/resources/dashbased.exe" ]; then
            if [[ "${{ matrix.label }}" == "Windows" ]]; then
              python3 -c "
              import json
              with open('src-tauri-wallet/src-tauri/tauri.conf.json', 'r') as f:
                conf = json.load(f)
              conf['bundle']['resources'] = ['resources/dashbased.exe']
              with open('src-tauri-wallet/src-tauri/tauri.conf.json', 'w') as f:
                json.dump(conf, f, indent=2)
              "
            else
              python3 -c "
              import json
              with open('src-tauri-wallet/src-tauri/tauri.conf.json', 'r') as f:
                conf = json.load(f)
              conf['bundle']['resources'] = ['resources/dashbased']
              with open('src-tauri-wallet/src-tauri/tauri.conf.json', 'w') as f:
                json.dump(conf, f, indent=2)
              "
            fi
            echo "Updated tauri.conf.json with daemon resource"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          projectPath: src-tauri-wallet
          tagName: ${{ github.ref_name }}
          releaseName: 'Dashbase Wallet v__VERSION__'
          releaseBody: |
            ## Dashbase Wallet v__VERSION__

            Download the appropriate installer for your platform:

            ### macOS
            - **Apple Silicon (M1/M2/M3)**: `Dashbase Wallet_*_aarch64.dmg`
            - **Intel**: `Dashbase Wallet_*_x64.dmg`

            ### Windows
            - **NSIS Installer**: `Dashbase Wallet_*_x64-setup.exe`
            - **MSI**: `Dashbase Wallet_*_x64_en-US.msi`

            ### Linux
            - **AppImage**: `dashbase-wallet_*.AppImage`
            - **Debian**: `dashbase-wallet_*.deb`
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build Tauri app (branch push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri-wallet
          args: --target ${{ matrix.target }}
