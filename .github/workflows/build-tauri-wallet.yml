name: Build Tauri Wallet

on:
  push:
    tags:
      - 'v*'
    branches:
      - tauri-wallet-rewrite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-wallet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-Intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri-wallet/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev xdg-utils

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Install frontend dependencies
        run: bun install
        working-directory: src-tauri-wallet

      - name: Download daemon binary
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri-wallet/src-tauri/resources

          # Map matrix label to daemon artifact name
          DAEMON_ARTIFACT=""
          if [[ "${{ matrix.label }}" == "macOS-ARM" ]]; then
            DAEMON_ARTIFACT="dashcore-macos-intel"
          elif [[ "${{ matrix.label }}" == "macOS-Intel" ]]; then
            DAEMON_ARTIFACT="dashcore-macos-intel"
          elif [[ "${{ matrix.label }}" == "Linux" ]]; then
            DAEMON_ARTIFACT="dashcore-linux-daemon"
          elif [[ "${{ matrix.label }}" == "Windows" ]]; then
            DAEMON_ARTIFACT="dashcore-windows"
          fi

          echo "Looking for daemon artifact: $DAEMON_ARTIFACT"

          # Find the latest successful build-wallets run on any branch
          DAEMON_RUN_ID=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow build-wallets.yml \
            --status success \
            --limit 5 \
            --json databaseId,headBranch \
            --jq '.[0].databaseId')

          if [ -z "$DAEMON_RUN_ID" ]; then
            echo "ERROR: No successful build-wallets run found. Cannot bundle daemon."
            echo "Falling back to PATH lookup — wallet will need external dashbased."
            exit 0
          fi

          echo "Found daemon build run: $DAEMON_RUN_ID"

          # Download the specific artifact from that run
          gh run download "$DAEMON_RUN_ID" \
            -n "$DAEMON_ARTIFACT" \
            -D daemon-artifacts \
            --repo ${{ github.repository }}

          echo "Downloaded daemon artifacts:"
          ls -la daemon-artifacts/ || true

          # Find and extract the daemon tarball
          TARBALL=$(find daemon-artifacts -name "*.tar.gz" | head -1)
          if [ -n "$TARBALL" ]; then
            echo "Extracting: $TARBALL"
            tar -xzf "$TARBALL" -C daemon-artifacts/
          fi

          # Also try zip for Windows
          ZIPFILE=$(find daemon-artifacts -name "*.zip" | head -1)
          if [ -n "$ZIPFILE" ]; then
            echo "Extracting: $ZIPFILE"
            cd daemon-artifacts && unzip -o "$ZIPFILE" && cd ..
          fi

          # Find the dashbased binary
          DAEMON_BIN=$(find daemon-artifacts -name "dashbased" -o -name "dashbased.exe" | head -1)
          if [ -z "$DAEMON_BIN" ]; then
            echo "ERROR: dashbased binary not found in artifact"
            exit 1
          fi

          echo "Found daemon binary: $DAEMON_BIN"
          if [[ "${{ matrix.label }}" == "Windows" ]]; then
            cp "$DAEMON_BIN" src-tauri-wallet/src-tauri/resources/dashbased.exe
          else
            cp "$DAEMON_BIN" src-tauri-wallet/src-tauri/resources/dashbased
            chmod +x src-tauri-wallet/src-tauri/resources/dashbased
          fi
          echo "Daemon binary placed in resources/"
          ls -la src-tauri-wallet/src-tauri/resources/

          # Update tauri.conf.json to include the daemon as a resource
          if [ -f "src-tauri-wallet/src-tauri/resources/dashbased" ] || [ -f "src-tauri-wallet/src-tauri/resources/dashbased.exe" ]; then
            if [[ "${{ matrix.label }}" == "Windows" ]]; then
              python3 -c "
              import json
              with open('src-tauri-wallet/src-tauri/tauri.conf.json', 'r') as f:
                conf = json.load(f)
              conf['bundle']['resources'] = ['resources/dashbased.exe']
              with open('src-tauri-wallet/src-tauri/tauri.conf.json', 'w') as f:
                json.dump(conf, f, indent=2)
              "
            else
              python3 -c "
              import json
              with open('src-tauri-wallet/src-tauri/tauri.conf.json', 'r') as f:
                conf = json.load(f)
              conf['bundle']['resources'] = ['resources/dashbased']
              with open('src-tauri-wallet/src-tauri/tauri.conf.json', 'w') as f:
                json.dump(conf, f, indent=2)
              "
            fi
            echo "Updated tauri.conf.json with daemon resource"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          projectPath: src-tauri-wallet
          tagName: ${{ github.ref_name }}
          releaseName: 'Dashbase Wallet v__VERSION__'
          releaseBody: |
            ## Dashbase Wallet v__VERSION__

            Download the appropriate installer for your platform:

            ### macOS
            - **Apple Silicon (M1/M2/M3)**: `Dashbase Wallet_*_aarch64.dmg`
            - **Intel**: `Dashbase Wallet_*_x64.dmg`

            ### Windows
            - **NSIS Installer**: `Dashbase Wallet_*_x64-setup.exe`
            - **MSI**: `Dashbase Wallet_*_x64_en-US.msi`

            ### Linux
            - **AppImage**: `dashbase-wallet_*.AppImage`
            - **Debian**: `dashbase-wallet_*.deb`
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build Tauri app (branch push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri-wallet
          args: --target ${{ matrix.target }}

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: dashbase-wallet-${{ matrix.label }}
          path: |
            src-tauri-wallet/src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri-wallet/src-tauri/target/*/release/bundle/**/*.msi
            src-tauri-wallet/src-tauri/target/*/release/bundle/**/*.exe
            src-tauri-wallet/src-tauri/target/*/release/bundle/**/*.deb
            src-tauri-wallet/src-tauri/target/*/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 30
